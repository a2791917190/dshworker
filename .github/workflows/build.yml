name: Build DSHwork

# 触发:推送 v* tag(如 v0.1.0),或手动 workflow_dispatch
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 只构建在范围内的平台:macOS + Windows
        include:
          - os: macos-latest
            build_script: npm run build:mac
            artifact: dshwork-mac
          - os: windows-latest
            build_script: npm run build:win
            artifact: dshwork-win
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install deps (desktop)
        working-directory: desktop
        run: npm ci

      # 内置运行时(node + harness)必须在**构建前**就位 —— extraResources 会把它打进
      # 应用与安装包,这是「离线自包含」的唯一来源。构建之后再 vendor 是进不了安装包的
      # (旧版把它塞在 afterPack 里,而且失败只打一句 warn,所以一直静默产出 thin 包)。
      # 只忽略内容、保留 README 的 .gitignore 规则保证这两个目录在干净检出时也存在。
      - name: Vendor bundled runtime (node + harness)
        working-directory: desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # 国内网络可取消注释换镜像(可选):
          # DSHWORK_NODE_DIST_MIRROR: https://npmmirror.com/mirrors/node
          # DSHWORK_NPM_REGISTRY: https://registry.npmmirror.com
        run: node ../plugins/vendor-runtime.cjs --vendor-root vendor

      # 没装全就直接失败,不要静默产出 thin 包。
      - name: Verify bundled runtime
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const c=p=>fs.existsSync(p);const node=c('vendor/node/bin/node')||c('vendor/node/node.exe');const h=c('vendor/harness/node_modules/@deepseek-ai/dsh/package.json');console.log('内置 node:',node?'ok':'MISSING');console.log('内置 harness:',h?'ok':'MISSING');if(!node||!h){process.exit(1)}"

      - name: Build
        working-directory: desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # 国内网络可取消注释换镜像(可选):
          # ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          # ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: ${{ matrix.build_script }} -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: |
            desktop/dist/*.zip
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.blockmap
          if-no-files-found: warn

      # 可选:tag 推送时自动发布 GitHub Release(免签的 mac 包首次需右键打开)。
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.zip
            desktop/dist/*.dmg
